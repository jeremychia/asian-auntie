# Future Features (v2+)

future_features:
  MATCH_THRESHOLD_FLOOR:
    name: Minimum Ingredient Match Threshold
    priority: high
    phase: v1.x
    description: Suppress recipe suggestions where the user is missing too many required ingredients
    rationale: |
      User feedback (Saumya, 2026-05-05): recipes are surfaced when the user has only ~20% of
      required ingredients, which feels irrelevant rather than inspiring. Filtering by number of
      missing ingredients (rather than %) gives a more intuitive cutoff — "missing 2 ingredients"
      is more actionable than "60% match".
    approach:
      - Filter out recipes where the user is missing more than N ingredients (configurable)
      - N should be tunable without a code deploy — store in config or admin setting
      - When results are sparse or empty, show a prompt encouraging the user to add more items
        to their pantry (e.g. "Add more pantry items to unlock better matches")
      - "You're missing X ingredients: [list]" remains visible on each card so users know what to buy
    requirements:
      - Configurable missing-ingredient ceiling (start with N=3 as a sensible default to tune from)
      - Empty/sparse state messaging must not feel like an error — frame as "add more to unlock"
    open_questions:
      - Should N vary by recipe length? (missing 3 of 5 vs missing 3 of 15 are very different)
      - Should the threshold be user-adjustable (a slider on the results page) or only admin-configurable?

  PANTRY_EXPANSION_SUGGESTIONS:
    name: Suggested Staple Purchases to Unlock More Recipes
    priority: high
    phase: v2
    description: |
      Recommend a small list of generic Asian pantry staples the user could buy to unlock
      significantly more recipe matches from their current pantry
    rationale: |
      When a user has few matches, the most useful response is not just "add more items" but
      "here's specifically what to buy." Many Asian recipes share a small set of high-leverage
      staples (e.g. fish sauce, oyster sauce, sesame oil, light soy sauce). Buying one or two
      of these can unlock dozens of recipes. This is more actionable than a generic nudge.
    approach:
      - For each ingredient the user is missing, count how many corpus recipes it would unlock
        given their current pantry (i.e. would drop a recipe from "missing 4" to "missing 3")
      - Surface the top 3–5 ingredients by unlock count as "buy these to cook more"
      - Show alongside each suggestion: how many more recipes it would unlock (e.g. "+12 recipes")
      - Suggestions should be generic/affordable staples — filter out niche or expensive items
    requirements:
      - Ingredient unlock counts computed from corpus at query time (or pre-cached if too slow)
      - Suggestions only shown when match results are sparse (don't clutter a full results page)
      - Links to the PANTRY_ITEMS canonical list — suggestions must be recognisable pantry names
    open_questions:
      - Should suggestions be cuisine-specific? (e.g. if user's pantry skews Japanese, suggest
        mirin/dashi rather than fish sauce)
      - Should the user be able to mark a suggestion as "I don't use this" to suppress it?

  PANTRY_FIRST_RECIPE_GENERATION:
    name: Pantry-First Recipe Generation (Corpus-Grounded)
    priority: high
    phase: v2
    description: |
      Generate a recipe that uses most or all of the user's available ingredients, grounded in
      the scraped Asian recipe corpus rather than free AI generation
    rationale: |
      User feedback (Saumya, 2026-05-05): "suggest a recipe inspired by current recipes for all
      or most of my existing ingredients... if it's grounded in proper Asian recipes, that's better
      [than ChatGPT]". Pure retrieval fails when no scraped recipe closely matches the user's pantry.
      Pure AI generation risks inventing dishes that sound Asian but aren't authentic. The middle
      path is RAG: the LLM composes a recipe using the user's ingredients, but is constrained to
      techniques and flavour profiles drawn from real corpus recipes.
    approach:
      - Retrieve the top-N corpus recipes most similar to the user's pantry (existing engine)
      - Pass those recipes as context to the LLM with a strict prompt: adapt using user's ingredients,
        do not invent techniques or flavour combinations not present in the provided recipes
      - LLM output must cite the recipe(s) it drew from — shown in UI as "Inspired by [Recipe Name]"
      - Label generated recipes distinctly (e.g. "AI-adapted") vs tested scraped recipes
    validity_controls:
      - Corpus-only grounding: LLM cannot introduce techniques absent from retrieved context
      - Mandatory source citation: every generated recipe traces to ≥1 real scraped recipe
      - No freeform generation: ruled out due to authenticity risk (LLM may produce plausible-sounding
        but non-authentic Asian dishes with no real-world basis)
      - Cuisine tag inherited from source recipe(s) — not AI-assigned
    requirements:
      - Corpus must be large enough to cover common pantry combinations before this feature ships
      - Generated recipes flagged in DB with source recipe IDs for auditability
      - User-facing label clearly distinguishes AI-adapted from scraped-and-tested recipes
    open_questions:
      - How many source recipes to pass as context? (more context = better grounding, higher token cost)
      - Should generated recipes be cached per pantry fingerprint, or generated fresh each time?
      - Do users trust AI-adapted recipes as much as scraped ones? May need user study.
      - Should users be able to rate/flag generated recipes as inauthentic?

  MULTI_SOURCE_EXPANSION:
    name: Multi-Source Recipe Expansion
    priority: high
    phase: v2
    description: Expand recipe corpus beyond SE Asian sources to cover the full Asian pantry spectrum
    rationale: |
      Phase 1 (SE Asian only) will return no results for users with Japanese, Korean, or Chinese pantries.
      Expanding to these cuisines significantly broadens usefulness without changing the core interaction.
    sources_priority:
      - Chinese (Cantonese/Sichuan): Woks of Life
      - Japanese: Just One Cookbook
      - Korean: Maangchi
      - Vietnamese/Thai: closer to SE Asian base, lower lift
    requirements:
      - Each new source requires legal/attribution arrangement before adding
      - Cuisine tag added to each recipe to enable filtering by cuisine (v2 feature)
      - Ingredient synonym map expanded to cover new cuisine's pantry vocabulary
    open_questions:
      - Which cuisine to add first? (Chinese likely largest SE Asian diaspora overlap)
      - Should users be able to filter by cuisine in results?

  STRUCTURED_FEEDBACK_IMPROVEMENT:
    name: Improve Recommendations from Feedback
    priority: high
    phase: v2
    description: Use structured feedback (made / not-for-me + reason) to improve result ranking
    rationale: |
      Binary like/dislike gives no signal on why a recipe was skipped. Structured reasons
      (too complex / missing ingredient / not my taste) let the system learn meaningfully.
      v2: use feedback to personalise ranking (surface "made this" recipes' cuisine/complexity
      profile more; surface "not my taste" less).
    requirements:
      - Minimum feedback volume threshold before personalisation kicks in (avoids cold-start noise)
      - Feedback attributed to session/user without requiring an account (local storage)
      - Skip reason "missing key ingredient" cross-references against actual pantry gap — useful signal
    open_questions:
      - How much feedback is needed before personalisation improves results meaningfully?
      - Should "made this" recipes be saveable/bookmarkable?

  RECIPE_SAVING:
    name: Recipe Saving and History
    priority: medium
    phase: v2
    description: Save recipes you liked or made, and see your cooking history
    features: |
      - Bookmark recipes for later reference
      - "Made this" history — recipes you've cooked, with date
      - "Cook again" shortcut from history
    open_questions:
      - Should saved recipes be available offline?
      - Should saves sync across devices (requires accounts)?

  CUISINE_FILTERING:
    name: Cuisine and Dietary Filtering
    priority: medium
    phase: v2
    description: Filter results by cuisine or dietary requirement
    rationale: Only meaningful once multi-source expansion adds enough recipes per cuisine to filter usefully.
    features:
      - Filter by cuisine (Malaysian, Chinese, Japanese, Korean, Vietnamese, Thai)
      - Filter by dietary (vegetarian, vegan, no pork, no shellfish)
    open_questions:
      - Should dietary filters be set as preferences (persistent) or per-search toggles?
      - How do we handle recipes with optional non-vegetarian components?

  INGREDIENT_SUBSTITUTION:
    name: Ingredient Substitution Suggestions
    priority: medium
    phase: v2
    description: When a recipe requires an ingredient the user doesn't have, suggest a viable substitute
    rationale: |
      "Missing: galangal" is useful information. "Missing: galangal — ginger works as a substitute"
      is more useful. This converts "I can't make this" into "I can almost make this."
    features:
      - Per-ingredient substitution note in recipe detail (e.g., "galangal -> fresh ginger (different but works)")
      - Substitution notes are manually curated, not AI-generated
    open_questions:
      - How authoritative should substitution suggestions be? (light note vs. strong recommendation)
      - Should substitutions affect match % calculation?

  EXPIRING_ITEM_SUGGESTIONS:
    name: Cook This Tonight (Expiry-Driven Suggestions)
    priority: medium
    phase: v2
    description: Proactively suggest recipes when items are about to expire
    rationale: |
      The natural connection between manage-perishables and recommend-recipe.
      "You have bok choy expiring in 2 days — here are 3 recipes that use it."
    requirements:
      - Opt-in only — not automatic push notifications
      - Only triggered when recipe corpus is large enough to reliably return results
        for expiring items (otherwise the feature feels broken)
      - Surfaces from expiry notification or as a banner in manage-perishables dashboard
    open_questions:
      - Should this appear in manage-perishables or recommend-recipe (or both)?
      - Trigger threshold: how many expiring items before suggesting?

  REVIEWS_COMMUNITY:
    name: Reviews and Community
    priority: low
    phase: v3+
    description: Allow users to share photos and notes about recipes they've cooked
    rationale: |
      Community trust is valuable but requires: user accounts, content moderation, privacy controls,
      food safety disclaimers, and significant ongoing maintenance. Not appropriate until the core
      recipe recommendation experience is well-established.
    deferred_because:
      - Product category shift (personal tool -> social platform)
      - Requires moderation infrastructure
      - Legal/liability implications if shared recipes lead to food safety issues
      - Single-user apps don't benefit from community features
    open_questions:
      - When is the right time to introduce community? (user count threshold?)
      - Should reviews be on-platform or linked to external sources?

  MEAL_PLANNING:
    name: Meal Planning
    priority: low
    phase: v3+
    description: Plan weekly meals from saved recipes and generate shopping lists
    rationale: |
      Valuable but a significant scope expansion — effectively a different product mode.
      Build after recipe saving, feedback improvement, and cuisine expansion are stable.
    features:
      - Save recipes to a weekly plan
      - Consolidated ingredient list across planned recipes
      - Cross-reference against pantry (what do I already have vs. need to buy?)
    open_questions:
      - Should meal planning integrate with grocery pricing data?
      - How should we handle recipes with shared ingredients in the shopping list?
