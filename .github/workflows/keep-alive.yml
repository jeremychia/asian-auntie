name: Keep Alive

on:
  schedule:
    - cron: "7 * * * *"
    - cron: "17 * * * *"
    - cron: "27 * * * *"
    - cron: "37 * * * *"
    - cron: "47 * * * *"
    - cron: "57 * * * *"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          DELAY=$(( RANDOM % 100 ))
          sleep $DELAY
          curl -sf https://asian-auntie.onrender.com/ -o /dev/null
