services:
  - type: postgresql
    name: asian-auntie-db
    plan: free
    ipAllowList: []

  - type: web
    name: asian-auntie
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: asian-auntie-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        scope: preview
        value: https://${RENDER_EXTERNAL_HOSTNAME}
      - key: ALLOWED_ORIGINS
        scope: production
        value: https://${RENDER_EXTERNAL_HOSTNAME}
